name: Gas prices scrape

on:
  push:
    branches:
      - main
  schedule:
     - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.2"
          
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libicu-dev \
            libpng-dev \
            zlib1g-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libgit2-dev \
            libxml2-dev \
            libmagick++-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfontconfig1-dev \
            pandoc \
            git \
            libudunits2-dev \
            libgdal-dev \
            libgeos-dev \
            libproj-dev

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ~/Rlib
          key: ${{ runner.os }}-v3-R-${{ hashFiles('**/scripts/*.R') }}
          restore-keys: |
            ${{ runner.os }}-v3-R-

      - name: Install R packages
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/Rlib
          echo 'R_LIBS_USER=~/Rlib' >> ~/.Renviron
          echo 'options(repos = c(CRAN = "https://cloud.r-project.org"))' >> ~/.Rprofile

          Rscript -e '
            .libPaths(c("~/Rlib", .libPaths()))
            install.packages(c("tidyverse", "tidycensus", "jsonlite", "remotes", "magick", "usethis", "V8", "httr"), dependencies = TRUE, lib = "~/Rlib")
            if (!requireNamespace("usethis", quietly = TRUE)) stop("usethis failed to install")
            remotes::install_github("munichrocker/DatawRappr", lib = "~/Rlib", auth_token = Sys.getenv("GITHUB_PAT"))
            library(tidyverse)
            library(DatawRappr)
          '

      - name: Run scraper
        env:
          API_KEY: ${{ secrets.API_KEY }}
          GAS_TABLE_KEY: ${{ secrets.GAS_TABLE_KEY }}
          GAS_MAP_KEY: ${{ secrets.GAS_MAP_KEY }}
          NATIONAL_KEY: ${{ secrets.NATIONAL_KEY }}
          EV_KEY: ${{ secrets.EV_KEY }}
        run: |
          . ~/.Renviron
          Rscript "gas_scrape.R"

      - name: Commit and rebase-push if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TARGET_BRANCH="${REF_NAME:-$DEFAULT_BRANCH}"
          echo "Target branch: $TARGET_BRANCH"

          git fetch origin "$TARGET_BRANCH"
          git checkout "$TARGET_BRANCH"

          echo "Staging expected CSVs…"
          git add gas_prices.csv || true
          git add gas_data_log.csv || true
          git add aaa-nat-gas-prices.csv || true
          git add CA-EV-prices.csv || true
          git add daily-county-data.csv || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(data): refresh gas CSVs on $(date -u +'%Y-%m-%d')"
          git pull --rebase origin "$TARGET_BRANCH"

          echo "Pushing…"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" HEAD:"$TARGET_BRANCH"
